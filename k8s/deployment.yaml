apiVersion: apps/v1
kind: Deployment
metadata:
  name: proveedores
spec:
  replicas: 1
  selector:
    matchLabels:
      app: proveedores
  template:
    metadata:
      labels:
        app: proveedores
    spec:
      containers:
        - name: proveedores
          image: 996241846882.dkr.ecr.us-east-1.amazonaws.com/sgil-proveedores-service:latest
          ports:
            - containerPort: 8005
          env:
            - name: DB_HOST_URL
              value: "${DB_HOST_URL}"
            - name: DB_NAME
              value: "db_proveedores"
            - name: DB_USER
              value: "postgres"
            - name: DB_PASSWORD
              value: "postgres"
            - name: DB_PORT
              value: "5432"
            - name: PROMETHEUS_MULTIPROC_DIR
              value: "/tmp"
            - name: CELERY_BROKER_URL
              value: "redis://redis-service:6379/0"
            - name: CELERY_RESULT_BACKEND
              value: "redis://redis-service:6379/0"

      imagePullSecrets:
        - name: regcred 
